<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund House</title>
<script src="/static/chart.umd.min.js"></script>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --good-ink:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#2a78d6; --accent-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-ink:#0ca30c; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-ink:#0ca30c; --accent:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--border)}
html{scrollbar-gutter:stable}
.bar{max-width:1320px;margin:0 auto;padding:12px 20px 6px;display:flex;gap:16px;align-items:center}
.brandcol{flex:1 1 auto;min-width:0;margin-right:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandcol .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-height:21px}
.brandcol .pills::-webkit-scrollbar{display:none}
.brandcol .pill{font-size:11.5px;padding:1px 8px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sub{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;min-height:42px}
.covertitle{padding:10px 14px;text-shadow:0 0 .7px currentColor;border-bottom:2px solid var(--accent);white-space:nowrap}
@media (max-width:800px){header{position:static}.bar{flex-wrap:wrap}.brandcol{width:100%}}
nav{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1 1 auto}
nav button{border:0;background:none;color:var(--ink-2);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);text-shadow:0 0 .7px currentColor}
nav a.navlink{color:var(--ink-2);padding:10px 14px;text-decoration:none;white-space:nowrap;margin-left:auto;border-bottom:2px solid transparent}
nav a.navlink:hover{color:var(--ink)}
nav .badge{background:var(--critical);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:6px}
main{max-width:1320px;margin:0 auto;padding:20px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:1fr}}
@media (max-width:560px){.g5{grid-template-columns:1fr} main{padding:12px 16px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.card h2{margin:0 0 12px;font-size:17px}
.kpi .v{font-size:26px;font-weight:650;margin:2px 0}
.kpi .s{color:var(--ink-2);font-size:12.5px}
.pos{color:var(--good-ink)} .neg{color:var(--critical)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--ink-2);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-good{background:var(--good)} .st-warning{background:var(--warning)} .st-serious{background:var(--serious)} .st-critical{background:var(--critical)} .st-muted{background:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--axis);padding:6px 8px;white-space:nowrap;cursor:default}
td{border-bottom:1px solid var(--grid);padding:6px 8px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.muted{color:var(--muted)} .small{font-size:12px}
.meter{position:relative;height:14px;background:var(--surface-2);border-radius:7px;margin:10px 0 18px}
.meter .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.meter .tl{position:absolute;top:18px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.chart{position:relative;height:280px}
.chart.sm{height:170px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.alert{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid)}
.alert:last-child{border:0}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--border);white-space:nowrap;height:fit-content}
.tag.RISK,.tag.critical,.tag.CRITICAL,.tag.REJECTED,.tag.rejected{color:var(--critical);border-color:var(--critical)}
.tag.ERROR{color:var(--critical);border-color:var(--critical)}
.tag.WARN,.tag.warning{color:#a26b00;border-color:var(--warning)}
.tag.APPROVED,.tag.approved,.tag.BUY,.tag.good{color:var(--good-ink);border-color:var(--good)}
.tag.SELL{color:var(--serious);border-color:var(--serious)}
.weeks{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.week{border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.week.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week .d{font-weight:600}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.agent{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer}
.agent:hover{border-color:var(--accent)}
.agent .r{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.agent .t{font-weight:600;margin:3px 0}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 12px}
.flow b{background:var(--surface-2);border-radius:6px;padding:3px 8px;font-weight:500;color:var(--ink)}
.md{font-size:13.5px;overflow-wrap:anywhere}
.md table{margin:8px 0} .md pre{background:var(--surface-2);padding:10px;border-radius:6px;overflow:auto;font-size:12px}
.md h1{font-size:18px} .md h2{font-size:15px} .md h3{font-size:14px}
details{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.primary{background:var(--good-ink);color:#fff;border-color:transparent;font-weight:600}
.btn.danger{color:var(--critical);border-color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:60px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:16px;border:1px solid}
.banner.warn{border-color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent)}
.banner.crit{border-color:var(--critical);background:color-mix(in srgb,var(--critical) 10%,transparent)}
.banner.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hbar{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.hbar .track{position:relative;height:16px}
.hbar .b{position:absolute;left:0;height:7px;border-radius:0 4px 4px 0}
.hbar .b.t{top:0;background:var(--s1)} .hbar .b.c{top:9px;background:var(--s2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{height:16px}
.theme{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
.cm{grid-template-columns:230px minmax(0,1fr)}
@media (max-width:800px){.cm{grid-template-columns:1fr}.weeks{max-height:220px}}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* ---------- events calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
.cal .day{min-height:74px;border:1px solid var(--grid);border-radius:6px;padding:4px 5px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.past{opacity:.45}
.cal .day.wkend{background:var(--surface-2)}
.cal .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .dn{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal .day.today .dn{color:var(--accent);font-weight:700}
.ev{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:4px;border-left:3px solid;background:var(--surface-2);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.macro{border-color:var(--s1)} .ev.earnings{border-color:var(--s2)} .ev.committee{border-color:var(--s3)}
.evdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.evdot.macro{background:var(--s1)} .evdot.earnings{background:var(--s2)} .evdot.committee{background:var(--s3)}
.evlist{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;font-size:12.5px;margin-top:12px;align-items:baseline}
@media (max-width:700px){.cal .day{min-height:44px;padding:3px}.ev{font-size:0;padding:0;width:8px;height:8px;border-radius:50%;border-left:0}
  .ev.macro{background:var(--s1)} .ev.earnings{background:var(--s2)} .ev.committee{background:var(--s3)}
  .cal .day .evs{display:flex;gap:3px;flex-wrap:wrap}}
/* ---------- multi-fund ---------- */
[hidden]{display:none!important}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stats .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}
.stats .s{font-size:12px;color:var(--ink-2)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g4{grid-template-columns:1fr}}
.switch{display:inline-flex;border:1px solid var(--border);border-radius:9px;padding:2px;background:var(--surface-2);gap:2px;overflow-x:auto;max-width:100%}
.switch button{border:0;background:none;color:var(--ink-2);padding:6px 12px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.switch button.on{background:var(--surface);color:var(--ink);text-shadow:0 0 .7px currentColor;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch .ccy{font-size:10.5px;color:var(--muted);font-weight:500}
.switch .badge{background:var(--critical);color:#fff;border-radius:10px;padding:0 6px;font-size:10.5px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.fundgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px}
@media (max-width:560px){.fundgrid{grid-template-columns:1fr}}
.fcard{display:flex;flex-direction:column;gap:12px}
.fcard .hd{display:flex;align-items:flex-start;gap:10px}
.fcard .hd h2{margin:0}
.fcard .strat{font-size:12.5px;color:var(--ink-2)}
.fcard .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fcard .nums .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fcard .nums .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.fcard .nums .s{font-size:12px;color:var(--ink-2)}
.spark{position:relative;height:90px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.minimeter{position:relative;height:6px;background:var(--surface-2);border-radius:3px;margin-top:5px}
.minimeter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ev.c1{border-color:var(--s1)} .ev.c2{border-color:var(--s2)} .ev.c3{border-color:var(--s3)}
.evdot.c1{background:var(--s1)} .evdot.c2{background:var(--s2)} .evdot.c3{background:var(--s3)}
@media (max-width:700px){.ev.c1{background:var(--s1)} .ev.c2{background:var(--s2)} .ev.c3{background:var(--s3)}}
.ftag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brandcol"><div class="brand" id="brand">Fund House<small>loading…</small></div><div class="pills" id="pills"></div></div>
    <div class="switch" id="switch" role="tablist" aria-label="Fund"></div>
    <button class="theme" id="themeBtn" title="Toggle light/dark">◐</button>
  </div>
  <div class="sub">
    <nav id="tabs" hidden>
      <button data-tab="overview">Overview</button>
      <button data-tab="approval">Approval <span class="badge" id="pendBadge" hidden>1</span></button>
      <button data-tab="committee">Committee &amp; agents</button>
      <button data-tab="market">Market &amp; screen</button>
      <button data-tab="audit">Audit trail</button>
      <a class="navlink" id="howLink" href="/how" hidden>How it works</a>
    </nav>
    <div class="covertitle" id="coverTitle">Overview of all funds</div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const TOKEN = "__FH_TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SYM = {USD: "$", HKD: "HK$", EUR: "€", GBP: "£", JPY: "¥", CNH: "CN¥", SGD: "S$"};
let CCY = "USD";
const cur = (v, d=2, ccy) => { const c = ccy || CCY; if (v==null||isNaN(v)) return "–";
  const s = (SYM[c] ?? (c + " ")) + Math.abs(Number(v)).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  return v < 0 ? "−" + s : s; };
const curs = (v, d=2, ccy) => v==null||isNaN(v) ? "–" : (v>=0 ? "+" : "") + cur(v, d, ccy);
const big = (v, ccy) => v==null||isNaN(v) ? "–" : Math.abs(v) >= 1e6 ? cur(v/1e6, 2, ccy) + "m" : cur(v, 0, ccy);
const pct = (v, d=1, sign=false) => { if (v==null||isNaN(v)) return "–"; let s = (v*100).toFixed(d); if (Number(s) === 0) s = (0).toFixed(d);
  return (sign && Number(s) > 0 ? "+" : "") + s + "%"; };
const num = (v, d=1) => v==null||isNaN(v) ? "–" : Number(v).toFixed(d);
const hhmm = t => t ? String(t).replace("T"," ").slice(5,16) : "";
const cls = v => v==null ? "" : v>=0 ? "pos" : "neg";
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const alpha = (hex, a) => { const h = hex.replace("#",""); const n = parseInt(h.length===3 ? h.split("").map(c=>c+c).join("") : h, 16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = ["--s1","--s2","--s3"];
let STATE = {fund: null, tab: "overview", cover: null, ov: null, weeks: null, week: null, weekDate: null, audit: null, mkt: null,
             weekFilter: "committee", holdSort: "weight", holdAsc: false, openHold: null, charts: []};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fapi = (what, q="") => api(`/api/f/${encodeURIComponent(STATE.fund)}/${what}${q}`);
function killCharts(){ STATE.charts.forEach(c => c.destroy()); STATE.charts = []; }

/* ---------- spec-driven cell formatting (column specs come from the fund's adapter) ---------- */
function fmt(v, kind, r){
  switch(kind){
    case "sym": return `<b>${esc(v)}</b>`;
    case "qty": return num(v, v % 1 ? 2 : 0);
    case "money": return cur(v);
    case "money0": return cur(v, 0);
    case "money3": return cur(v, v != null && Math.abs(v) < 20 ? 3 : 2);
    case "moneys": return `<span class="${cls(v)}">${curs(v)}</span>`;
    case "price": return `<span title="${esc(r && r.price_source)}${r && r.bid ? ` · bid ${r.bid} / ask ${r.ask}` : ""}">${cur(v, v != null && Math.abs(v) < 20 ? 3 : 2)}</span>`;
    case "pct": return pct(v);
    case "pct0": return pct(v, 0);
    case "pct0s": return `<span class="${cls(v)}">${pct(v,0,true)}</span>`;
    case "pct1s": return `<span class="${cls(v)}">${pct(v,1,true)}</span>`;
    case "pct2s": return `<span class="${cls(v)}">${pct(v,2,true)}</span>`;
    case "num0": return num(v,0); case "num1": return num(v,1); case "num2": return num(v,2);
    case "int": return v==null ? "–" : Number(v).toLocaleString();
    case "rank": return v==null ? '<span class="neg" title="Outside the screen today">out</span>' : esc(v);
    case "yn": return v==null ? "–" : v ? "yes" : "no";
    case "mcap": return v ? cur(v/1e9, 1) + "bn" : "–";
    case "pe": return r.pe_live==null ? '<span class="muted" title="Loss-making or no SEC data">n/m</span>' : `${num(r.pe_live)}<div class="small muted">sector ${num(r.sector_median_pe)}</div>`;
    case "stop": { const near = r.dist_to_stop != null && r.dist_to_stop > -0.03;
      return `${near ? '<span class="tag RISK">near</span> ' : ""}${pct(r.dist_to_stop,1)}<div class="small muted">${cur(r.active_stop)}</div>`; }
    case "raw": return esc(v ?? "–");
    default: return esc(v ?? "–");
  }
}
const isNumCol = k => !["sym","text","yn"].includes(k);

/* ---------- theme ---------- */
(function(){ try{ const t = localStorage.getItem("fh-theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){} })();
$("#themeBtn").onclick = () => {
  const c = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const n = c === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  try{ localStorage.setItem("fh-theme", n); }catch(e){}
  render();
};

/* ---------- header: brand, fund switcher, status pills ---------- */
function setPills(list){ $("#pills").innerHTML = (list||[]).map(([st, t]) => `<span class="pill"><span class="dot st-${st}"></span>${esc(t)}</span>`).join(""); }
function header(){
  const c = STATE.cover;
  const funds = c ? c.funds : [];
  $("#switch").innerHTML = `<button data-f="" class="${STATE.fund ? "" : "on"}">All funds</button>` +
    funds.map(f => `<button data-f="${esc(f.id)}" class="${STATE.fund===f.id ? "on" : ""}">${esc(f.label)} <span class="ccy">${esc(f.currency)}</span>${(f.pending||f.halted) ? '<span class="badge">!</span>' : ""}</button>`).join("");
  document.querySelectorAll("#switch button").forEach(b => b.onclick = () => nav(b.dataset.f || null, STATE.fund ? STATE.tab : "overview"));
  $("#tabs").hidden = !STATE.fund; $("#coverTitle").hidden = !!STATE.fund;
  if (!STATE.fund){
    $("#brand").innerHTML = `Fund House<small>${funds.length} funds · updated ${esc(c ? c.now_hkt.replace("T"," ").slice(0,16) : "")} HKT</small>`;
    const gw = funds.map(f => (f.pills||[])[0]).find(Boolean);
    setPills(gw ? [gw] : []);
    return;
  }

/* ---------- fund overview ---------- */
function ladderMeter(dd, ladder, mandate){
  const W = mandate * 1.1;
  const x = v => Math.min(100, Math.abs(v) / W * 100);
  const L = (ladder||[]).slice().sort((a,b) => b[0]-a[0]);
  const worst = L.length ? L[L.length-1][0] : -mandate;
  const col = dd <= worst ? "var(--critical)" : (L.length && dd <= L[0][0]) ? "var(--serious)" : "var(--s1)";
  let ticks = L.map(([t, c]) => `<div class="tick" title="${pct(t,0)}: max invested ${pct(c,0)}" style="left:${x(t)}%"></div>`).join("");
  ticks += `<div class="tick" title="Mandate limit ${pct(-mandate,0)}" style="left:${x(-mandate)}%;background:var(--critical)"></div>`;
  const steps = L.map(([t, c]) => `${pct(t,0)} → ${c ? pct(c,0) + " max" : (L.length === 1 ? "halt, sell all" : "cash")}`).join(" · ");
  return `<div class="meter" style="margin-bottom:8px" role="img" aria-label="Drawdown ${pct(dd)}"><div class="fill" style="width:${x(dd)}%;background:${col}"></div>${ticks}</div>
    <div class="small muted">${L.length > 1 ? "Ladder" : "Rule"}: ${steps} · <span class="neg">mandate ${pct(-mandate,0)}</span></div>`;
}
function ageTxt(h, warnH){ if (h==null) return '<span class="muted">never ran</span>'; const st = h > warnH ? "critical" : "good";
  return `<span class="dot st-${st}"></span> ${h < 1 ? "<1" : Math.round(h)}h ago`; }

function eventsCard(E){
  if (!E || E.error || !E.start) return `<div class="card"><h2>Upcoming events</h2><div class="muted small">${esc((E && E.error) || "No event data.")}</div></div>`;
  const K = Object.fromEntries((E.kinds||[]).map(([k, l, c]) => [k, {l, c}]));
  const kc = k => "c" + ((K[k]||{}).c || 1);
  const base = new Date(E.start + "T00:00:00");
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const byDay = {}; E.events.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < E.days; i++){
    const d = new Date(base); d.setDate(base.getDate() + i);
    const k = iso(d), evs = byDay[k] || [];
    const c = ["day", k < E.today ? "past" : "", k === E.today ? "today" : "", d.getDay() % 6 === 0 ? "wkend" : ""].join(" ");
    const label = (d.getDate() === 1 || i === 0) ? `${mon[d.getMonth()]} ${d.getDate()}` : d.getDate();
    cells += `<div class="${c}" title="${esc(evs.map(e => e.label + " — " + e.detail).join("\n"))}"><span class="dn">${label}</span><div class="evs">${evs.map(e => `<div class="ev ${kc(e.kind)}">${esc(e.label)}</div>`).join("")}</div></div>`;
  }
  const horizon = (() => { const d = new Date(E.today + "T00:00:00"); d.setDate(d.getDate() + 14); return iso(d); })();
  const next = E.events.filter(e => e.date >= E.today && e.date <= horizon && e.kind !== "committee").slice(0, 8);

    case "fundamental": { const r = j.ratings||[]; const n = k => r.filter(x => x.rating===k).length; return `${n("Buy")} Buy · ${n("Hold")} Hold · ${n("Avoid")} Avoid`; }

function execTable(x){
  const runs = x.runs ? x.runs : [{results: x.results || []}];
  return runs.map(r => `${r.time_hkt ? `<div class="small muted" style="margin-top:6px">${esc(r.time_hkt)}</div>` : ""}<div class="tbl"><table><tr><th>Symbol</th><th>Side</th><th class="n">Qty</th><th class="n">Filled</th><th class="n">Avg / limit</th><th>Status</th></tr>${(r.results||[]).map(q=>`<tr><td>${esc(q.symbol)}</td><td>${esc(q.side||"")}</td><td class="n">${q.qty??""}</td><td class="n">${q.filled??""}</td><td class="n">${q.avg_price ?? q.limit ?? (q.limits||[]).join(", ")}</td><td class="small">${esc(q.status)}</td></tr>`).join("")}</table></div>`).join("");
}

/* ---------- market (blocks from the adapter) ---------- */
async function renderMarket(){
  if (!STATE.mkt) STATE.mkt = await fapi("market");
  const B = STATE.mkt.blocks || [];
  const half = B.filter(b => b.half), full = B.filter(b => !b.half);
  const box = (b, i) => {
    if (b.type === "kv") return `<div class="card"><h2>${esc(b.title)}</h2><table>${b.rows.map(([k,v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</table></div>`;
    if (b.type === "text") return `<div class="card"><h2>${esc(b.title)}</h2><div class="small">${b.html}</div></div>`;
    return `<div class="card"><div class="row"><h2 style="margin:0">${esc(b.title)}</h2>${b.filter ? `<input data-q="${i}" placeholder="Filter" style="max-width:240px;margin-left:auto">` : ""}</div>
      ${b.note ? `<p class="small muted">${esc(b.note)}</p>` : ""}<div class="tbl" id="mt${i}" style="margin-top:8px"></div></div>`;
  };
  const idx = b => B.indexOf(b);
  $("#main").innerHTML = (STATE.mkt.asof ? `<div class="small muted" style="margin-bottom:10px">Research pack ${esc(STATE.mkt.asof)}</div>` : "") +
    (half.length ? `<div class="grid g2e">${half.map(b => box(b, idx(b))).join("")}</div><div class="spacer"></div>` : "") +
    full.map(b => box(b, idx(b))).join('<div class="spacer"></div>');
  B.forEach((b, i) => { if (b.type !== "table") return;
    let sortK = b.sort || null, asc = true;
    const draw = () => {
      const qi = document.querySelector(`[data-q="${i}"]`), q = qi ? qi.value.toLowerCase() : "";
      let rows = (b.rows||[]).filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
      if (sortK) rows = rows.slice().sort((x,y) => { const a=x[sortK], c=y[sortK]; if (a==null) return 1; if (c==null) return -1; return (a>c?1:a<c?-1:0)*(asc?1:-1); });
      document.getElementById("mt"+i).innerHTML = rows.length ? `<table><tr>${b.cols.map(([k,t,f]) => `<th class="${isNumCol(f)?"n":""}" data-k="${k}" style="cursor:pointer">${esc(t)}${sortK===k?(asc?" ▲":" ▼"):""}</th>`).join("")}</tr>
        ${rows.map(r => `<tr>${b.cols.map(([k,,f]) => `<td class="${isNumCol(f)?"n":""}">${fmt(r[k], f, r)}</td>`).join("")}</tr>`).join("")}</table>` : '<div class="muted small">No data.</div>';
      document.querySelectorAll(`#mt${i} th`).forEach(th => th.onclick = () => { const k = th.dataset.k; asc = sortK===k ? !asc : true; sortK = k; draw(); });
    };
    const qi = document.querySelector(`[data-q="${i}"]`); if (qi) qi.oninput = draw;
    draw(); });
}

/* ---------- audit ---------- */
async function renderAudit(){
  if (!STATE.audit) STATE.audit = await fapi("audit");
  const ev = STATE.audit.events;
  $("#main").innerHTML = `<div class="card"><div class="row"><h2 style="margin:0">Audit trail</h2>
      <select id="ak" style="max-width:180px;margin-left:auto"><option value="">All events</option><option value="decision">Your decisions</option><option value="committee">Committee proposals</option><option value="fill">Fills</option><option value="alert">Alerts</option></select>
      <input id="aq" placeholder="Search" style="max-width:220px"></div>
    <p class="small muted">Every proposal, approval, fill and risk alert for this fund, newest first. Raw files:
      ${(STATE.audit.files||[]).map(f => `<a target="_blank" href="/api/file?path=${encodeURIComponent(f)}">${esc(f.split("/").pop())}</a>`).join(" · ")}</p>
    <div class="tbl" id="atbl"></div></div>`;
  const draw = () => {
    const k = $("#ak").value, q = $("#aq").value.toLowerCase();
    const rows = ev.filter(e => (!k || e.kind===k) && (!q || JSON.stringify(e).toLowerCase().includes(q))).slice(0, 800);
    $("#atbl").innerHTML = `<table><tr><th>Time (HKT)</th><th>Type</th><th>Level</th><th>Event</th></tr>${rows.map(e => `<tr><td class="small" style="white-space:nowrap">${esc(String(e.time||"").replace("T"," ").slice(0,16))}</td><td class="small">${esc(e.kind)}</td><td><span class="tag ${esc(e.level)}">${esc(e.level)}</span></td>
      <td>${esc(e.text)}${e.folder ? ` <a href="#" data-f="${esc(e.folder)}" class="small">open</a>` : ""}</td></tr>`).join("")}</table>${rows.length ? "" : '<div class="empty">No matching events</div>'}`;
    document.querySelectorAll("#atbl a[data-f]").forEach(a => a.onclick = e => { e.preventDefault(); STATE.weekDate = a.dataset.f; nav(STATE.fund, "committee"); });
  };
  $("#ak").onchange = draw; $("#aq").oninput = draw; draw();
}

/* ---------- routing: #/ = cover, #/<fund>/<tab> ---------- */
const TABS = {overview: renderOverview, approval: renderApproval, committee: renderCommittee, market: renderMarket, audit: renderAudit};
function parseHash(){
  const [f, t] = location.hash.replace(/^#\/?/, "").split("/");
  return {fund: f || null, tab: TABS[t] ? t : "overview"};
}
function nav(fundId, tab){ location.hash = fundId ? `#/${fundId}/${tab || "overview"}` : "#/"; }
async function loadWeek(date){
  if (STATE.week && STATE.week.date === date && STATE.week._fund === STATE.fund) return STATE.week;
  STATE.week = await fapi("week", "?d=" + encodeURIComponent(date)); STATE.week._fund = STATE.fund;
  return STATE.week;
}
async function load(){
  if (!STATE.fund){
    STATE.cover = await api("/api/funds");
  } else {
    const [ov, weeks] = await Promise.all([fapi("overview"), fapi("weeks")]);
    STATE.ov = ov; STATE.weeks = weeks; CCY = ov.currency;
    if (!STATE.cover) api("/api/funds").then(c => { STATE.cover = c; header(); }).catch(() => {});
  }
  STATE.audit = null; STATE.week = null; STATE.mkt = null;
  header();
}
async function render(){
  killCharts();
  header();
  try {
    if (!STATE.fund) renderCover();
    else await TABS[STATE.tab]();
  } catch(e){ $("#main").innerHTML = `<div class="banner crit">${esc(e.message)}</div>`; }
}
async function route(){
  const r = parseHash(), changed = r.fund !== STATE.fund;
  STATE.tab = r.tab;
  if (changed){ STATE.fund = r.fund; STATE.ov = null; STATE.weekDate = null; STATE.openHold = null; STATE.holdSort = "weight"; STATE.holdAsc = false;
    $("#main").innerHTML = '<div class="empty">Loading…</div>'; }
  try { if (changed || !STATE.cover) await load(); await render(); window.scrollTo(0,0); }
  catch(e){ $("#main").innerHTML = `<div class="banner crit">Cannot load: ${esc(e.message)}</div>`; }
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => nav(STATE.fund, b.dataset.tab));
window.addEventListener("hashchange", route);
route();
setInterval(async () => { if ((!STATE.fund || STATE.tab === "overview") && !document.hidden) { try { await load(); render(); } catch(e){} } }, 120000);
</script>
